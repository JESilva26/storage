{% extends "layout.html" %}
{% block content %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
        }

        .login-card {
            max-width: 420px;
            width: 100%;
            border: none;
            border-radius: 16px;
        }

        .login-title {
            font-weight: 700;
        }

        .form-control {
            padding: 0.75rem 1rem;
        }

        .btn-login {
            padding: 0.75rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row min-vh-100 justify-content-center align-items-center">
        <div class="col-auto">

            <div class="card shadow-lg login-card">
                <div class="card-body p-5">

                    <h2 class="text-center login-title mb-2">
                        Welcome Back
                    </h2>

                    <p class="text-center text-muted mb-4">
                        Sign in to your account
                    </p>

                    <form method="POST" action="/login">

                        <div class="mb-3">
                            <label for="email" class="form-label">
                                Email
                            </label>
                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                name="email"
                                placeholder="name@example.com"
                                required
                            >
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">
                                Password
                            </label>
                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                required
                            >
                        </div>

                        <button
                            type="submit"
                            class="btn btn-dark w-100 btn-login"
                        >
                            Sign In
                        </button>

                    </form>

                    <div class="text-center mt-4">
                        <span class="text-muted">
                            Don't have an account?
                        </span>
                        <a href={{ url_for('signup_page') }} class="text-decoration-none">
                            Sign up
                        </a>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>

{% endblock content %}
