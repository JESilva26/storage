<!DOCTYPE html>
<html>
<head>
    {% if title %}
      <title>Storage - {{ title }}</title>
    {% else %}
      <title>Storage</title>
    {% endif %}

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">

    <style>
        html, body {
            min-height: 100vh;
        }

        body {
            display: flex;
            flex-direction: column;

            background:
                linear-gradient(
                    rgba(15, 23, 42, 0.85),
                    rgba(15, 23, 42, 0.90)
                ),
                url("https://images.unsplash.com/photo-1557683316-973673baf926?auto=format&fit=crop&w=1800&q=80");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            color: white;
        }

        .navbar {
            backdrop-filter: blur(12px);
            background: rgba(17, 24, 39, 0.75) !important;
            border-bottom: 1px solid rgba(255,255,255,0.08);

            position: relative;
            z-index: 1050;
        }

        .dropdown-menu {
            z-index: 1060;
        }

        .navbar-brand {
            font-weight: 700;
            letter-spacing: 1px;
        }

        .nav-link {
            color: rgba(255,255,255,0.85) !important;
        }

        .nav-link:hover {
            color: white !important;
        }

        main {
            flex: 1;
        }

        .content-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 20px;
            padding: 2rem;
        }

        footer {
            background: rgba(17, 24, 39, 0.75) !important;
            backdrop-filter: blur(12px);
        }
    </style>
</head>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">

        <a class="navbar-brand" href="{{ url_for('home') }}">
            STORAGE
        </a>

        <div class="navbar-nav">

            <a class="nav-link" href="{{ url_for('home') }}">
                Home
            </a>

            {% if current_user %}

            <div class="nav-item dropdown">

                <a
                    class="nav-link dropdown-toggle"
                    href="#"
                    role="button"
                    data-bs-toggle="dropdown"
                    aria-expanded="false"
                >
                    Account
                </a>

                <ul class="dropdown-menu dropdown-menu-end">

                    <li>
                        <a
                            class="dropdown-item"
                            href="{{ url_for('account') }}"
                        >
                            My Files
                        </a>
                    </li>

                    <li><hr class="dropdown-divider"></li>

                    <li>
                        <a
                            class="dropdown-item text-danger"
                            href="{{ url_for('logout') }}"
                        >
                            Sign Out
                        </a>
                    </li>

                </ul>

            </div>

            {% else %}

            <a class="nav-link" href="{{ url_for('login_page') }}">
                Login
            </a>

            {% endif %}

        </div>
    </div>
</nav>

<main class="container my-5">
    <div class="content-card">
        {% block content %}
        {% endblock content %}
    </div>
</main>

<footer class="py-3 border-top">
    <div class="container text-center">
        <p class="text-light mb-0">
            © <span id="year"></span> John Silva
        </p>
    </div>
</footer>

<script>
    document.getElementById("year").textContent =
        new Date().getFullYear();
</script>

</body>
</html>
