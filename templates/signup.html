{% extends "layout.html" %}
{% block content %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
        }

        .signup-card {
            max-width: 420px;
            width: 100%;
            border: none;
            border-radius: 16px;
        }

        .signup-title {
            font-weight: 700;
        }

        .form-control {
            padding: 0.75rem 1rem;
        }

        .btn-signup {
            padding: 0.75rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row min-vh-100 justify-content-center align-items-center">
        <div class="col-auto">

            <div class="card shadow-lg signup-card">
                <div class="card-body p-5">

                    <h2 class="text-center signup-title mb-2">
                        Create Account
                    </h2>

                    <p class="text-center text-muted mb-4">
                        Sign up to get started
                    </p>

                    <form method="POST" action="/signup">

                        <div class="mb-3">
                            <label for="username" class="form-label">
                                Username
                            </label>
                            <input
                                type="text"
                                class="form-control"
                                id="username"
                                name="username"
                                placeholder="Choose a username"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">
                                Email
                            </label>
                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                name="email"
                                placeholder="name@example.com"
                                required
                            >
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">
                                Password
                            </label>
                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                placeholder="Create a password"
                                required
                            >
                        </div>

                        <button
                            type="submit"
                            class="btn btn-dark w-100 btn-signup"
                        >
                            Create Account
                        </button>

                    </form>

                    <div class="text-center mt-4">
                        <span class="text-muted">
                            Already have an account?
                        </span>
                        <a href="/login" class="text-decoration-none">
                            Sign in
                        </a>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>

{% endblock content %}
