name: actions
run-name: ${{ github.actor }} is learning GitHub Actions
on: [push]
jobs:
  Simple_Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - run: python -m pip install --upgrade pip

      - run: pip install -r requirements.txt

      - run: pytest
